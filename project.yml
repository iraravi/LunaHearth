name: LunaHearth
options:
  bundleIdPrefix: com.neuralluna
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Internal: release
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "647V74N5JV"
    CODE_SIGN_STYLE: Automatic
    CLOUDKIT_ENVIRONMENT: Development
    APS_ENVIRONMENT: development
    CURRENT_PROJECT_VERSION: 98
    MARKETING_VERSION: 3.0
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG RECEIPT_DEBUG"
    Internal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RECEIPT_DEBUG"
      CLOUDKIT_ENVIRONMENT: Production
      APS_ENVIRONMENT: production
    Release:
      CLOUDKIT_ENVIRONMENT: Production
      APS_ENVIRONMENT: production
targets:
  LunaHearth:
    type: application
    platform: iOS
    sources:
      - path: LunaHearth
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuralluna.lunahearth
        INFOPLIST_FILE: LunaHearth/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LunaHearth/Resources/LunaHearth.entitlements
        PRODUCT_NAME: LunaHearth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: LunaHearthWatch
    scheme:
      testTargets:
        - LunaHearthTests
        - LunaHearthUITests
  LunaHearthWatch:
    type: application
    platform: watchOS
    sources:
      - path: LunaHearthWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuralluna.lunahearth.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nam Illam
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.neuralluna.lunahearth
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        CODE_SIGN_ENTITLEMENTS: LunaHearthWatch/Resources/LunaHearthWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LunaHearthWatchWidgets
  LunaHearthWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: LunaHearthWatchWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuralluna.lunahearth.watchkitapp.widgets
        INFOPLIST_FILE: LunaHearthWatchWidgets/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LunaHearthWatchWidgets/Resources/LunaHearthWatchWidgets.entitlements
        SKIP_INSTALL: YES
  LunaHearthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LunaHearthTests
    dependencies:
      - target: LunaHearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuralluna.lunahearth.tests
        GENERATE_INFOPLIST_FILE: YES
  LunaHearthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LunaHearthUITests
    dependencies:
      - target: LunaHearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuralluna.lunahearth.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LunaHearth
  LunaHearthWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: LunaHearthWatchUITests
    dependencies:
      - target: LunaHearthWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuralluna.lunahearth.watchuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LunaHearthWatch

schemes:
  LunaHearthWatch:
    build:
      targets:
        LunaHearthWatch: all
    test:
      targets:
        - LunaHearthWatchUITests
  LunaHearthInternal:
    build:
      targets:
        LunaHearth: all
    run:
      config: Internal
    archive:
      config: Internal
