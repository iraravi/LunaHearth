<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LunaHearth · Navigation preview</title><style>
:root{--paper:#f8f5ee;--ink:#292d28;--muted:#686d63;--line:#e4e2d8;--green:#355d4b;--soft:#e8eee5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #527bba;outline-offset:4px}button{min-height:44px;border:0;background:none;border-radius:12px}h1,h2,h3,p{margin:0}h1{font:500 clamp(32px,4vw,48px)/1.15 Georgia,serif;letter-spacing:-1px}h2{font-size:20px;font-weight:600}h3{font-size:18px}small,.muted{color:var(--muted)}.demo{padding:7px 20px;text-align:center;background:#eae6dd;font-size:12px;letter-spacing:.5px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 32px)}aside{padding:35px 22px;border-right:1px solid var(--line);position:sticky;top:0;height:calc(100vh - 32px)}.brand{font:25px Georgia,serif;margin-bottom:42px}.brand span{display:block;font:11px system-ui;letter-spacing:2px;color:var(--muted);margin-top:8px}nav{display:grid;gap:7px}nav button{text-align:left;padding:12px 16px;display:flex;align-items:center;gap:13px}nav button[aria-current=page]{background:var(--soft);color:var(--green);font-weight:650}.ico{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.sidefoot{position:absolute;bottom:28px;color:var(--muted);font-size:13px}main{max-width:1180px;width:100%;margin:auto;padding:30px 44px 70px;align-self:start}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:10px}.eyebrow{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}.avatar{display:inline-grid;place-items:center;border:3px solid var(--paper);border-radius:50%;background:#dce6dc;width:37px;height:37px;font-size:12px;font-weight:600}.avatar+.avatar{margin-left:-9px;background:#ece0d8}.title{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:27px}.title p{margin-top:10px;color:var(--muted)}.primary{background:var(--green);color:white;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.outline{border:1px solid var(--line);padding:9px 15px;background:#ffffff75}.hero{background:#eee9de;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr 43%;margin-bottom:28px;min-height:205px}.hero>div{padding:30px}.hero h2{font:32px/1.15 Georgia,serif;margin-bottom:12px}.hero img{height:100%;max-height:245px;width:100%;object-fit:cover}.hero p{max-width:330px;margin-bottom:18px;color:#595f54}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tile{text-align:left;padding:0;background:#fffefa;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .2s}.tile:hover{transform:translateY(-3px)}.tile img{width:100%;height:130px;object-fit:cover;display:block}.tile .inner{padding:18px}.tile h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}.tile p{font-size:14px;color:var(--muted)}.tile .status{margin-top:13px;font-size:12px;color:var(--green)}.section{margin:28px 0 14px;display:flex;align-items:center;justify-content:space-between}.panel{border:1px solid var(--line);background:#fffefa;border-radius:20px;padding:22px}.row{display:flex;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .grow{flex:1}.row p{color:var(--muted);font-size:14px}.badge{background:var(--soft);color:var(--green);padding:5px 10px;border-radius:20px;font-size:12px;white-space:nowrap}.food{display:grid;place-items:center;width:49px;height:49px;border-radius:14px;background:#f2eee4;font-size:28px}.back{padding:0 8px;display:inline-flex;gap:8px;align-items:center;color:var(--muted)}.tools{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.tools input{flex:1;min-width:120px;border:1px solid var(--line);padding:10px 14px;border-radius:13px;background:#fffefa}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.metric{font:42px Georgia,serif;margin:10px 0}.notice{background:var(--soft);padding:16px 20px;border-radius:15px;margin-bottom:20px;color:var(--green)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}.week button{padding:12px 4px;background:white;border:1px solid var(--line)}.week button.active{background:var(--green);color:white}.week span{display:block}.empty{padding:25px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:24px;background:var(--paper);color:var(--ink);padding:28px;width:min(480px,calc(100% - 24px));max-height:90vh;overflow:auto}dialog::backdrop{background:#20251e60;backdrop-filter:blur(5px)}dialog h2{font:28px Georgia,serif;margin:10px 0}dialog p{color:var(--muted);margin-bottom:20px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}.option{width:100%;text-align:left;border:1px solid var(--line);background:white;padding:14px;margin:5px 0}.option small{display:block}label.field{display:grid;gap:8px;margin:16px 0}label.field input,label.field select{width:100%;padding:12px;border:1px solid #cacdc1;border-radius:12px;background:white}.step{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--green)}.receipt{font:14px/1.8 ui-monospace,monospace;background:white;border:1px dashed #a7ac9c;padding:18px;margin:15px 0}.receipt div{display:flex;justify-content:space-between}.check{display:flex;align-items:center;gap:10px;min-height:44px}.check input{width:19px;height:19px;accent-color:var(--green)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#293e32;color:white;border-radius:14px;padding:13px 22px;box-shadow:0 8px 30px #0002;z-index:10;max-width:90%;text-align:center}.hidden{display:none!important}@media(max-width:900px){main{padding:26px}.shell{grid-template-columns:180px 1fr}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.hero h2{font-size:28px}}@media(max-width:600px){.shell{display:block}aside{position:fixed;top:auto;bottom:0;width:100%;height:auto;padding:8px 10px max(8px,env(safe-area-inset-bottom));background:#faf8f0ed;backdrop-filter:blur(18px);z-index:5;border:0;border-top:1px solid var(--line)}.brand,.sidefoot{display:none}nav{display:flex;justify-content:space-around;gap:2px}nav button{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:11px}main{padding:22px 18px 110px}.top{margin-bottom:23px}.title{gap:12px;align-items:flex-start}.title h1{font-size:34px}.title .primary{font-size:14px;padding:9px 13px;white-space:nowrap}.hero{min-height:165px;grid-template-columns:1.1fr .9fr}.hero>div{padding:20px}.hero h2{font-size:25px}.hero p{font-size:13px;margin-bottom:12px}.hero img{max-height:210px}.hero .outline{font-size:13px;padding:7px 10px}.grid{gap:12px}.tile img{height:105px}.tile .inner{padding:14px}.tile h3{font-size:17px}.tile p{font-size:12px}.tile .status{font-size:11px}.row{gap:10px}.row .outline{padding:8px 10px;font-size:13px}.panel{padding:17px}.toast{bottom:95px}.demo{font-size:10px}.eyebrow{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media(prefers-contrast:more){:root{--muted:#42483e;--line:#8d9485}}

.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}.shelf-card{border:1px solid var(--line);border-radius:23px;background:#fffdf8;padding:14px;min-width:0}.shelf-art{height:110px;background:#edf0e5;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:15px}.shelf-card h3{font-size:19px;margin-bottom:6px}.shelf-card p{font-size:14px;color:var(--muted);margin:5px 0 12px}.shelf-card .outline{width:100%;margin-top:10px}.shelf-card .badge{display:inline-block;white-space:normal}.pantry-card .shelf-art{background:#f5e9d9}.shelf-card[hidden]{display:none}.feature-banner{display:grid;grid-template-columns:1fr 38%;align-items:center;overflow:hidden;border-radius:22px;background:#e7edde;margin-bottom:23px}.feature-banner>div{padding:22px}.feature-banner h2{font:29px Georgia,serif;margin-bottom:7px}.feature-banner img{height:145px;width:100%;object-fit:cover}.feature-banner.pantry{background:#f0e7db}.route-links{display:flex;gap:8px;overflow:auto;margin-bottom:22px;padding-bottom:5px}.route-links button{white-space:nowrap;border:1px solid var(--line);padding:8px 14px;background:#fffaf1}.route-links button[aria-current=page]{background:var(--green);color:white;border-color:var(--green)}@media(max-width:600px){.shelves{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.shelf-card{padding:12px}.shelf-art{height:95px;font-size:44px}.feature-banner>div{padding:18px}.feature-banner h2{font-size:24px}.feature-banner img{height:130px}.shelf-card h3{font-size:17px}}
</style></head><body><div class="demo">NAVIGATION PREVIEW · Shelf & card views · Sample data only</div><div class="shell"><aside><div class="brand">LunaHearth<span>A LITTLE MORE TOGETHER</span></div><nav aria-label="Main navigation" id="nav"></nav><div class="sidefoot">Kira Home<br>Ravi & Kira</div></aside><main id="main"></main></div><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const A='../../LunaHearth/Resources/Assets.xcassets/';const imgs={home:'WelcomeResidence.imageset/artwork.png',shopping:'ShoppingShelvesFresh.imageset/ShoppingShelvesFresh.png',pantry:'EditorialPantry.imageset/artwork.png',meals:'HearthTable.imageset/artwork.png',expenses:'EditorialPlanning.imageset/artwork.png',rooms:'HomeLiving.imageset/artwork.png'};
const paths={home:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',today:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',calendar:'M4 5h16v16H4zM8 3v4m8-4v4M4 10h16',more:'M5 12h.01M12 12h.01M19 12h.01',arrow:'m9 5 7 7-7 7',back:'m15 5-7 7 7 7',plus:'M12 5v14M5 12h14',receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6'};
const icon=n=>`<svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.arrow}"/></svg>`;
let page='home',tab='home',bought=false,receiptSaved=false,shopping=[{name:'Milk',amount:'2 litres',emoji:'🥛'},{name:'Tomatoes',amount:'1 kg',emoji:'🍅'},{name:'Bananas',amount:'6 pieces',emoji:'🍌'}],pantry=[{name:'Milk',amount:'1 litre',emoji:'🥛',low:true},{name:'Rice',amount:'5 kg',emoji:'🍚'},{name:'Cumin',amount:'100 g',emoji:'🫙'}],picked=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){page=p;if(['home','today','calendar','more'].includes(p))tab=p;render();window.scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true})}
function title(t,sub,action=''){return `<div class="title"><div><h1 tabindex="-1">${t}</h1><p>${sub}</p></div>${action}</div>`}function btn(label,fn,cls='outline'){return `<button type="button" class="${cls}" onclick="${fn}">${label}</button>`}function photo(k){return `<img src="${A+imgs[k]}" alt="" loading="lazy">`}
function render(){document.getElementById('nav').innerHTML=['today','calendar','home','more'].map(n=>`<button onclick="go('${n}')" ${tab===n?'aria-current="page"':''}>${icon(n)}${n[0].toUpperCase()+n.slice(1)}</button>`).join('');let html=`<div class="top">${['home','today','calendar','more'].includes(page)?'<span class="eyebrow">Kira Home · shared with Ravi</span>':btn(icon('back')+' Home',"go('home')",'back')}<span aria-label="Ravi and Kira"><span class="avatar">R</span><span class="avatar">K</span></span></div>`;
if(page==='home'){html+=title('Home, together.','Everything has its place.');html+=`<div class="hero"><div><span class="eyebrow">Less to keep in your head</span><h2 style="margin-top:12px">One receipt.<br>A little less to do.</h2><p>Review your purchases, update your pantry and keep track of spending.</p>${btn(icon('receipt')+' Try a sample receipt','receipt()')}</div>${photo('home')}</div><div class="section"><h2>Your everyday</h2></div><div class="grid">`;const data=[['shopping','Shopping','What we need to buy',shopping.length+' items to buy'],['pantry','Pantry','What we have at home',pantry.length+' items · '+pantry.filter(x=>x.low).length+' low stock'],['meals','Meals','Decide what’s for dinner','Plan with your pantry'],['expenses','Expenses','Keep spending in view',receiptSaved?'$24.50 added today':'Review this month'],['rooms','Rooms & belongings','Care for your home','2 rooms · 4 belongings'],['reminders','Reminders','Small things to remember','1 due today']];html+=data.map(([key,name,desc,status])=>`<button class="tile" onclick="go('${key}')">${photo(key==='reminders'?'expenses':key)}<div class="inner"><h3>${name}${icon('arrow')}</h3><p>${desc}</p><div class="status">${status}</div></div></button>`).join('')+'</div>'}
if(page==='shopping'){html+=title('Shopping',`${shopping.length} items to buy · Shared with your home`,btn('+ Add',"addItem()",'primary'))+`<div class="feature-banner"><div><h2>Your next shop.</h2><p class="muted">${shopping.length} now · Everything your home needs</p></div>${photo('shopping')}</div><div class="tools"><input aria-label="Search shopping" placeholder="Find an item" oninput="filterRows(this.value)"></div><div class="section"><h2>Next shop</h2><span class="badge">Ravi is buying</span></div><div class="shelves">${shopping.map((x,i)=>`<article class="shelf-card searchable" data-name="${esc(x.name.toLowerCase())}"><div class="shelf-art" aria-hidden="true">${x.emoji}</div><h3>${esc(x.name)}</h3><p>${esc(x.amount)}</p><span class="badge">${pantry.some(p=>p.name.toLowerCase()===x.name.toLowerCase())?'Also in pantry':'Needed now'}</span>${btn('Mark bought',`purchase(${i})`)}</article>`).join('')||'<div class="empty">All done. Your shopping list is clear.</div>'}</div>`}
if(page==='pantry'){html+=title('Pantry','Know what’s already at home.',btn('+ Add',"info('Add to pantry','In the app, choose a photo, receipt, starter list or manual entry. This preview focuses on shopping and receipt transfers.')",'primary'))+`<div class="feature-banner pantry"><div><h2>Your pantry.</h2><p class="muted">${pantry.length} ingredients · At a glance</p></div>${photo('pantry')}</div><div class="tools"><input aria-label="Search pantry" placeholder="Find an ingredient" oninput="filterRows(this.value)"></div><div class="section"><h2>At home</h2><span class="badge">${pantry.filter(x=>x.low).length} low stock</span></div><div class="shelves">${pantry.map(x=>`<article class="shelf-card pantry-card searchable" data-name="${esc(x.name.toLowerCase())}"><div class="shelf-art" aria-hidden="true">${x.emoji}</div><h3>${esc(x.name)}</h3><p>${esc(x.amount)}</p><span class="badge">${x.low?'↓ Low stock':'In stock'}</span><p style="margin-top:14px">${x.expiry?'Pack expiry: '+esc(x.expiry):'No expiry date set'}</p></article>`).join('')}</div>`}
if(page==='expenses'){html+=title('Expenses','A clear picture of household spending.',btn('+ Receipt','receipt()','primary'))+`<div class="cols"><div class="panel"><span class="eyebrow">September · sample report</span><div class="metric">$${receiptSaved?'348.50':'324.00'}</div><p class="muted">Household spending this month</p><div class="row"><div class="grow">Groceries</div><b>$${receiptSaved?'248.50':'224.00'}</b></div><div class="row"><div class="grow">Home essentials</div><b>$100.00</b></div></div><div class="panel"><h2>Recent receipts</h2>${receiptSaved?'<div class="row"><div class="grow"><h3>Sample Market</h3><p>Today · 3 items reviewed</p></div><b>$24.50</b></div>':'<p class="muted" style="margin-top:16px">Try the sample receipt to see how purchases connect.</p>'}</div></div>`}
if(page==='today'){html+=title('A little clarity for today.','Saturday, September 26 · Sample day');html+=`<div class="hero"><div><span class="eyebrow">Your next moment</span><h2 style="margin-top:12px">An afternoon<br>for the family.</h2><p>3:00 PM · Kira’s appointment</p>${btn('Open calendar',"go('calendar')")}</div>${photo('rooms')}</div><div class="section"><h2>Needs your attention</h2></div><div class="panel"><div class="row"><div class="grow"><h3>${shopping.length} things to pick up</h3><p>Ravi · Shared shopping list</p></div>${btn('Shopping',"go('shopping')")}</div><div class="row"><div class="grow"><h3>Decide on tomorrow’s meals</h3><p>Start with what’s in your pantry</p></div>${btn('Meals',"go('meals')")}</div></div>`}
if(page==='calendar'){html+=title('Calendar','Your family’s day, in one place.')+`<div class="week">${['M 21','T 22','W 23','T 24','F 25','S 26','S 27'].map((d,i)=>`<button class="${i===5?'active':''}" onclick="info('Sample calendar','This prototype shows Saturday’s appointments. Full date navigation stays in the native app.')">${d.split(' ').join('<br>')}</button>`).join('')}</div><div class="panel"><div class="row"><span class="avatar">K</span><div class="grow"><h3>Appointment</h3><p>Kira · 3:00–3:30 PM</p></div></div><div class="row"><span class="avatar">R</span><div class="grow"><h3>Pick up groceries</h3><p>Ravi · 4:00 PM</p></div>${btn('View list',"go('shopping')")}</div></div>`}
if(page==='meals'){html+=title('Meals','Start with your pantry. Decide together.')+`<div class="hero"><div><span class="eyebrow">Tomorrow’s dinner</span><h2 style="margin-top:12px">A plan that<br>fits your home.</h2><p>Choose a meal style and use ingredients you already have.</p>${btn('Explore meal ideas',"info('Meal ideas','In the app, choose your preferred style and review pantry-based suggestions. No meals are generated in this design preview.')")}</div>${photo('meals')}</div><div class="panel"><h2>Your meal plan</h2><p class="muted" style="margin-top:8px">No meal planned yet. Suggestions and saved plans live here together.</p></div>`}
if(page==='rooms'){html+=title('Rooms & belongings','Your spaces, and the things you care for.')+`<div class="grid">${['Living room','Kitchen'].map(n=>`<button class="tile" onclick="info('${n}','Room layouts, belongings, warranties and maintenance open here in the app.')">${photo('rooms')}<div class="inner"><h3>${n}${icon('arrow')}</h3><p>2 belongings</p></div></button>`).join('')}</div>`}
if(page==='reminders'){html+=title('Reminders','The small things, remembered.')+`<div class="panel"><div class="row"><div class="grow"><h3>Take out recycling</h3><p>Today · Apple Reminders</p></div>${btn('View',"info('Apple Reminders','The app opens reminders from your connected Apple list. This sample does not access your reminders.')")}</div></div>`}
if(page==='more'){html+=title('More','People, preferences and a little help.')+`<div class="panel">${['Family & sharing','Apple connections','Notifications','Help & guides','Privacy & data'].map(n=>`<div class="row"><div class="grow"><h3>${n}</h3></div>${btn(icon('arrow'),`info('${n}','This opens the corresponding settings screen in the app. No account or device settings change in this preview.')`)}</div>`).join('')}</div><div class="section">${btn('Reset sample data','location.reload()')}</div>`}
document.getElementById('main').innerHTML=html}
function filterRows(q){document.querySelectorAll('.searchable').forEach(r=>r.hidden=!r.dataset.name.includes(q.toLowerCase()))}function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal').showModal()}function closeModal(){document.getElementById('modal').close()}function info(t,p){modal(`<h2>${t}</h2><p>${p}</p><div class="actions">${btn('Done','closeModal()','primary')}</div>`)}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),4500)}
function purchase(i){picked=i;const x=shopping[i];modal(`<span class="step">Finish shopping</span><h2>Bought ${esc(x.name.toLowerCase())}?</h2><p>${esc(x.amount)} · Choose where this purchase goes.</p><button class="option" onclick="finishPurchase(true)"><b>Add to pantry</b><small>${pantry.some(p=>p.name.toLowerCase()===x.name.toLowerCase())?'Update the existing item and clear low stock.':'Keep this purchase in your home inventory.'}</small></button><button class="option" onclick="finishPurchase(false)"><b>Bought for elsewhere</b><small>Finish shopping without adding to your pantry.</small></button><div class="actions">${btn('Cancel','closeModal()')}</div>`)}
function finishPurchase(stock){const x=shopping.splice(picked,1)[0];if(stock){const p=pantry.find(p=>p.name.toLowerCase()===x.name.toLowerCase());if(p){p.amount=p.name==='Milk'?'3 litres':p.amount+' + '+x.amount;p.low=false}else pantry.push({...x,low:false})}closeModal();render();modal(`<span class="step">All connected</span><h2>${esc(x.name)} is bought.</h2><p>${stock?'Pantry updated. The shopping item is cleared.':'Shopping updated. Nothing was added to your pantry.'}</p><div class="actions">${btn('Keep shopping','closeModal()')}${stock?btn('View pantry',"closeModal();go('pantry')",'primary'):''}</div>`)}
function addItem(){modal(`<h2>Add to shopping</h2><form onsubmit="event.preventDefault();saveItem(this)"><label class="field">Item name<input name="item" required maxlength="60" placeholder="e.g. Apples"></label><label class="field">Amount <small>Optional</small><input name="amount" maxlength="30" placeholder="e.g. 6 pieces"></label><div class="actions">${btn('Cancel','closeModal()')}<button class="primary" type="submit">Add item</button></div></form>`)}function saveItem(f){let name=f.item.value.trim();if(!name)return;if(shopping.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('Already on your shopping list');return}shopping.push({name,amount:f.amount.value.trim()||'Amount not set',emoji:'🛒'});closeModal();render();toast('Added to shopping')}
function receipt(){if(receiptSaved){info('Receipt already saved','This sample receipt has already been added. Reset sample data under More to try again.');return}modal(`<span class="step">1 of 2 · Review sample receipt</span><h2>A quick check first.</h2><p>Receipt scans can make mistakes. Review names and prices before adding.</p><div class="receipt"><b>SAMPLE MARKET · DEMO</b><div><span>Milk · 2 litres</span><span>$6.00</span></div><div><span>Tomatoes · 1 kg</span><span>$4.50</span></div><div><span>Rice · 5 kg</span><span>$14.00</span></div><hr><div><b>Total</b><b>$24.50</b></div></div><div class="actions">${btn('Cancel','closeModal()')}${btn('Continue','receiptReview()','primary')}</div>`)}
function receiptReview(){closeModal();modal(`<span class="step">2 of 2 · Choose what to update</span><h2>One review. All connected.</h2><label class="check"><input type="checkbox" checked disabled>Save $24.50 to expenses</label><label class="check"><input id="stock" type="checkbox" checked>Add 3 purchases to pantry</label><label class="check"><input id="clear" type="checkbox" checked>Mark matching shopping items bought</label><label class="field">Milk expiry <small>Optional · Check the pack</small><input id="expiry" type="date"></label><p>Existing pantry items will be updated, not duplicated.</p><div class="actions">${btn('Back','closeModal();receipt()')}${btn('Save sample receipt','saveReceipt()','primary')}</div>`)}
function saveReceipt(){let stock=document.getElementById('stock').checked,clear=document.getElementById('clear').checked,expiry=document.getElementById('expiry').value;let count=shopping.filter(x=>['Milk','Tomatoes','Rice'].includes(x.name)).length;if(stock){[{name:'Milk',amount:'2 litres',emoji:'🥛'},{name:'Tomatoes',amount:'1 kg',emoji:'🍅'},{name:'Rice',amount:'5 kg',emoji:'🍚'}].forEach(x=>{let p=pantry.find(p=>p.name===x.name);if(p){p.amount=p.name==='Rice'?'10 kg':p.name==='Milk'?(p.amount==='3 litres'?'5 litres':'3 litres'):p.amount+' + '+x.amount;p.low=false}else pantry.push({...x,low:false})})}if(stock&&expiry){pantry.find(x=>x.name==='Milk').expiry=expiry}if(clear)shopping=shopping.filter(x=>!['Milk','Tomatoes','Rice'].includes(x.name));receiptSaved=true;closeModal();render();modal(`<span class="step">Saved in this preview only</span><h2>Everything is in place.</h2><div class="row"><div class="grow">Expense recorded</div><b>$24.50</b></div>${stock?'<div class="row"><div class="grow">Pantry updated</div><b>3 purchases</b></div>':''}${clear?`<div class="row"><div class="grow">Shopping cleared</div><b>${count} items</b></div>`:''}<div class="actions">${btn('View pantry',"closeModal();go('pantry')")}${btn('View expense',"closeModal();go('expenses')",'primary')}</div>`)}render();
</script></body></html>
